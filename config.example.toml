# spotipulse configuration
#
# The real file lives at ~/.config/spotipulse/config.toml and is created for you
# on first run. This template only shows its shape — never put real credentials here.

[spotify]
client_id = "your-client-id"
client_secret = "your-client-secret"
# Must match, character for character, the redirect URI set in your Spotify app dashboard.
redirect_uri = "http://127.0.0.1:8888/callback"

[app]
# Seconds between "now playing" refreshes.
refresh_interval = 3
# How album art is drawn:
#   "auto"    the terminal's image protocol (Sixel / Kitty), real images (default)
#   "blocks"  colored half-blocks: plain text, no leftovers or flicker, works everywhere
#   "unicode" coarser text-only fallback
#   "off"     no artwork at all
covers = "auto"
# Where exported recap cards are saved. Defaults to ~/Pictures (or your home folder).
# export_dir = "~/Pictures"
